packages:
  - "packages/*"
  - "apps/*"

nodeLinker: isolated
shamefullyHoist: true
linkWorkspacePackages: true
preferWorkspacePackages: true
strictPeerDependencies: false
autoInstallPeers: true
strictStorePkgContentCheck: false

overrides:
  upath: 1.2.0

allowBuilds:
  # devecocli 的 postinstall 只是后台文档索引，CLI 功能不依赖它
  '@deveco/deveco-cli': false
  canvas: false
  core-js: false
  electron-winstaller: false
  esbuild: true
  fsevents: false
  husky: false
  playwright-chromium: false
  unrs-resolver: false
