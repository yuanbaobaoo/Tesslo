packages:
  # 产品层域包（app/state/ui/formats/extensions/platform-adapter）与 scratch-link
  - "packages/*"
  # 三原生壳：ohos = HarmonyOS HAP 工程(workspace 包)；android/ios 暂为规划文档
  - "apps/host/*"
  # 兼容引擎：绞杀者收缩区，包名与 import 不变，仅目录归组（D7）
  - "packages/engine/scratch/*"
  - "apps/*"

nodeLinker: isolated
shamefullyHoist: true
linkWorkspacePackages: true
preferWorkspacePackages: true
strictPeerDependencies: false
autoInstallPeers: true
strictStorePkgContentCheck: false

overrides:
  upath: 1.2.0

allowBuilds:
  # devecocli 的 postinstall 只是后台文档索引，CLI 功能不依赖它
  '@deveco/deveco-cli': false
  canvas: false
  core-js: false
  electron-winstaller: false
  esbuild: true
  fsevents: false
  husky: false
  playwright-chromium: false
  unrs-resolver: false
