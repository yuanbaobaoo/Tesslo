# 纯 JS/TS 测试 + lint 门禁（产品层 + 引擎边界 + scratch-link 协议一致性）。
# push master 不触发 CI：门禁在本地（pnpm test / pnpm lint，见 .agent/release-rule.md）；
# tag 发版链路的测试在 ohos-hap.yml 内执行。

name: Test

on:
  pull_request:

jobs:
  test:
    name: Lint and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (product layer + host scripts + engine D8 boundaries)
        run: pnpm lint

      - name: Typecheck and test
        run: pnpm test
