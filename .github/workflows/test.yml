# 纯 JS 测试（scratch-link 服务端 + 协议一致性），PR / push 均触发。
# 不需要 OHOS 工具链，跑 pnpm test 即可。

name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
