<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tesslo</title>
    <style>
        html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background: #e9f1fc; }
        #boot {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 16px system-ui, sans-serif; color: #575e75; background: #e9f1fc; z-index: 10;
        }
        #boot.hidden { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="boot">正在加载 Tesslo…</div>
    <script>
        window.addEventListener('load', () => document.getElementById('boot').classList.add('hidden'));
        window.addEventListener('error', event => {
            const boot = document.getElementById('boot');
            boot.classList.remove('hidden');
            boot.textContent = `加载失败：${event.message || '未知错误'}`;
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
